version: 2
# Compatible releases are batched across modules so shared driver dependencies
# move together and produce one repository-level validation result.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: friday }
    open-pull-requests-limit: 3
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories:
      - /
      - /docs
      - /eventscore
      - /eventsfake
      - /eventstest
      - /examples
      - /integration
      - /driver/gcppubsubevents
      - /driver/kafkaevents
      - /driver/natsevents
      - /driver/natsjetstreamevents
      - /driver/redisevents
      - /driver/snsevents
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      compatible-go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
